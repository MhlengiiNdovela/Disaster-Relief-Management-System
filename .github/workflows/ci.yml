name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build "Disaster Relief Management System/Disaster Relief Management System.slnx" -c Release --nologo

      - name: Test
        run: dotnet test tests/GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj -c Release --nologo --logger "console;verbosity=normal"
